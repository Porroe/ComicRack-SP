plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cyo.comicrack.viewer'
    compileSdk 37
    buildToolsVersion "37.0.0"
    useLibrary "org.apache.http.legacy"

    defaultConfig {
        applicationId 'com.cyo.comicracksp'
        minSdk 26
        targetSdk 37
        versionCode 104
        versionName '2.0'
    }

    flavorDimensions += 'implementation'
    productFlavors {
        source {
            dimension 'implementation'
        }
    }

    sourceSets {
        main.java.setSrcDirs([])
        source.java.srcDir('src/main/java')
    }

    androidResources {
        additionalParameters += ['--stable-ids', file('stable-resource-ids.txt').absolutePath]
    }


    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    sourceImplementation 'com.github.junrar:junrar:8.1.2'
    sourceImplementation 'com.google.android.material:material:1.13.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
